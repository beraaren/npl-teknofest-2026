patterns:
  electrical_fire:
    description: "Elektrik tesisatı, motor veya kablolarda kısa devre/ark oluşması sonucu yangın."
    risk_score: 95
    risk_level: "Yüksek"
    indicators:
      - "elektrik panosundan duman/ateş"
      - "kablo izolasyonunda yanık kokusu"
      - "parlama/ark flaş görülmesi"
      - "VLM tarafından elektrik kaynaklı yangın bildirimi"
    keywords: "elektrik yangını kısa devre ark kablo pano motor yanık duman"
    required_nodes: ["elektrik_pano"]
    potential_hazards:
      - "Tesis yangını"
      - "Elektrik çarpması"
      - "Duman zehirlenmesi"
    mock_tool_hints:
      - "isolate_electrical_grid"
      - "trigger_fire_suppression"
      - "broadcast_evacuation"
      - "call_ambulance"
      - "notify_supervisor"

  chemical_fire:
    description: "Kimyasal maddelerin reaksiyonu, tutuşması veya ısınması sonucu çıkan yangın."
    risk_score: 95
    risk_level: "Yüksek"
    indicators:
