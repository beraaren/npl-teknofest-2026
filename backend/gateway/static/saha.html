<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saha Ekibi | İSG Video Analizi</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="saha.js"></script>
</head>
<body>
  <header>
    <h1>🚨 Saha Ekibi Ekranı</h1>
    <nav class="nav-links">
      <a href="index.html">Süpervizör</a>
      <a href="saha.html" class="active">Saha Ekibi</a>
      <a href="admin.html">Admin</a>
      <a href="demo.html">Canlı Demo</a>
    </nav>
    <span id="role-status" class="meta">Ekip seçin</span>
  </header>

  <div class="app">
    <main class="main">
      <div class="role-selector" id="role-selector"></div>

      <div class="filter-row">
        <label class="meta">Durum
          <select id="status-filter">
            <option value="">Tümü</option>
            <option value="atandi" selected>Bekleyen</option>
            <option value="goruldu">Görülen</option>
            <option value="devam_ediyor">İntikal Edilen</option>
            <option value="tamamlandi">Biten</option>
          </select>
        </label>
        <button class="btn btn-secondary" id="refresh-btn">Yenile</button>
      </div>

      <div id="assignments-container"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
</body>
</html>
