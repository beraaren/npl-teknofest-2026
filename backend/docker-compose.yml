      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - TEKNOFEST_CONFIG=/app/config.yaml
      - PYTHONPATH=/app
    volumes:
      - ../data:/app/data
      - ../src:/app/src
      - ../Kanal_B:/app/Kanal_B
      - ../backend:/app/backend
      - ../config.yaml:/app/config.yaml
      # Analiz kutuphanesinin videolari; salt okunur baglanir (arayuz bunlari oynatir).
