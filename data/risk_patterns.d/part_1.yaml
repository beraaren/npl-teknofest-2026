    required_nodes: []
    potential_hazards:
      - "Zehirli gaz salınımı"
      - "Patlama"
      - "Yanık"
    mock_tool_hints:
      - "activate_cbrn_protocol"
      - "broadcast_evacuation"
      - "call_ambulance"
      - "notify_supervisor"

  dust_explosion:
    description: "Tozlu ortamda kıvılcım veya statik elektrik nedeniyle ani patlama ve yangın."
