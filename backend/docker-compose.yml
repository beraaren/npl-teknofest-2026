      - ../src:/app/src
      - ../Kanal_B:/app/Kanal_B
      - ../backend:/app/backend
      - ../config.yaml:/app/config.yaml
      # Analiz kutuphanesinin videolari; salt okunur baglanir (arayuz bunlari oynatir).
