      - "call_health_team"

  ergonomic_monitor_neck:
    description: "Monitör/ekranın ergonomik olmayan konumundan kaynaklanan boyun/omuz ağrısı."
    risk_score: 30
    risk_level: "Düşük"
    indicators:
      - "monitör çok alçak/yüksek"
      - "personel baş eğik"
      - "uzun süre sabit oturuş"
