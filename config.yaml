# TEKNOFEST 2026 Senaryo 3 — Video Analiz ve Karar Destek Sistemi
# Tüm eşikler, model yolları ve senaryo ayarları merkezi olarak buradan yönetilir.

project:
  name: "TEKNOFEST 2026 Senaryo 3 — İSG Video Analiz Ajanı"
  version: "2.0.0"
  language: "tr"
  output_dir: "outputs"
  log_dir: "logs"

# ---------------------------------------------------------------------------
# Video Ön İşleme
# ---------------------------------------------------------------------------
preprocessing:
  target_frame_count: 10          # VLM'e gönderilecek kare sayısı
  grid_columns: 4                 # Grid görüntüsü sütun sayısı
  frame_width: 384                # Tek kare genişliği
  frame_height: 216               # Tek kare yüksekliği
  use_smart_sampling: true        # SSIM + Laplacian ile akıllı örnekleme
  ssim_threshold: 0.92            # Bu eşiğin üzerindeki tekrarlı kareler atılır
  min_laplacian_variance: 80.0    # Bulanık kare filtresi (düşük = daha katı)
  enhance_low_light: true         # CLAHE/gamma düzeltme
  clahe_clip_limit: 2.0
  clahe_grid_size: [8, 8]
  critical_frame_count: 4         # VLM'e (Kanal B) gönderilecek kritik kare sayısı
  temporal_windows: 4             # Video kaç zaman dilimine bölünür
  min_frames_per_window: 1        # Her dilimden minimum kare sayısı

  # Son Pencere Güçlendirmesi — videonun sonunda gerçekleşen olaylar için
  # (araç çarpması, çökme gibi olaylar genellikle son saniyelerde oluşur)
  last_window_boost: 2            # Son pencere için ekstra kare kotası (toplam = min_frames + boost = 3)
  last_window_fraction: 0.25      # Videonun son kaçta biri "son pencere" sayılır (%25)

  # Sahne Değişimi Segmentasyonu (run_channel_b_scene_based için)
  scene_ssim_threshold: 0.30      # 1-SSIM bu değeri aşarsa yeni sahne sayılır
                                  # Daha düşük → daha hassas (fazla segment)
                                  # Daha yüksek → daha az segment
  scene_min_segment_sec: 15.0     # Segment en az bu kadar uzun olmalı (sn)
  scene_max_segment_sec: 60.0     # Segment bu süreyi geçemez (sn); güvenlik tavanı
  scene_detect_stride: 5          # SSIM her kaç karede bir hesaplanır (hız/hassasiyet dengesi)

  channel_a_fps: 12.0             # Kanal A yoğun örnekleme hedefi (track sürekliliği; algı + olay motoru bu akışta çalışır)


# ---------------------------------------------------------------------------
# Algı (Perception)
# ---------------------------------------------------------------------------
perception:
  detector_backend: "ultralytics"  # "ultralytics" | "hf_transformers" (YOLO eğitilene kadar HF aktif)
  yolo_model: "yoloworld_ft_v2_1.pt"             # COCO önceden eğitilmiş veya kendi ağırlığınız (eğitim sonrası aktifleşecek)
  custom_classes:                      # TEKNOFEST özel sınıfları (kendi modelinizde varsa)
    - arac
    - insan
    - palet
    - baret
    - yelek
    - yangin
    - duman
  confidence_threshold: 0.35
  tracker: "bytetrack"                 # "bytetrack" | "botsort"
  tracker_persist: true
  # HF transformers detection backend'i (geçici)
  hf_model: "PaddlePaddle/PP-DocLayoutV3_safetensors"
  hf_threshold: 0.5
  hf_device: "cpu"           # "auto" | "cuda" | "cpu" — bu model RTX 4060'ta CUDA hatası veriyor, cpu güvenli
  # Araç isimlendirme: YOLO 'arac' etiketlerini Kanal B öncesi VLM ile spesifikleştirir
  vehicle_labeling:
    enabled: true
    max_vehicles: 8             # tek VLM çağrısında gönderilecek max crop
    min_confidence: 0.35        # bu eşiğin altındaki track'ler isimlendirilmez
    padding_ratio: 0.15         # bbox genişletme oranı
    max_tokens: 768

# ---------------------------------------------------------------------------
# Olay Tespit Motoru
# ---------------------------------------------------------------------------
events:
  enabled_rules:
    - tip_over
    - fall
    - gathering
    - immobility
    - ppe_missing
    - proximity
    - fire_smoke
    - leakage
  thresholds:
    tip_over:
      aspect_ratio_min: 1.45        # w/h; forklift yandan görünümde düşük, devrilmede yüksek
      aspect_ratio_max: 4.0
      min_duration_frames: 3
    fall:
      vertical_drop_pixels: 60
      speed_drop_ratio: 0.5
    gathering:
      min_persons: 3
      max_inter_center_distance: 120  # piksel
      min_duration_frames: 10
    immobility:
      stationary_threshold_pixels: 15
      min_duration_seconds: 2.5
    ppe_missing:
      classes: ["baret", "yelek"]
      # Not: KKD eşleştirmesi piksel eşiği kullanmaz. Baret/yelek, personel bbox'ının
      # dikey bandında mı diye denetlenir (baret: üst %45, yelek: %15-85). Oranlar
      # src/perception/scene_graph.py içindeki sabitlerde tanımlıdır; kameraya
      # uzaklıktan bağımsız çalışması için sabit piksel eşiği bilinçli olarak kaldırıldı.
    proximity:
      dangerous_pairs:
        - ["arac", "insan"]
      distance_threshold_pixels: 100
    fire_smoke:
      enabled: false                # VLM tabanlı placeholder
    leakage:
      enabled: false                # VLM tabanlı placeholder

# ---------------------------------------------------------------------------
# VLM Backend (vLLM öncelikli, llama.cpp/transformators fallback)
# ---------------------------------------------------------------------------
vlm:
  default_backend: "auto"         # "auto" | "vllm" | "llama_cpp" | "transformers" | "server"
  auto_preference: ["vllm", "llama_cpp", "transformers"]

  # OpenAI-uyumlu harici sunucu (llama-server / vllm serve) — Kanal_B ile aynı sözleşme
  server:
    base_url: "http://localhost:8080"
    model_name: "llava-v1.6-mistral-7b"
    temperature: 0.15
    max_tokens: 16000

  # vLLM ayarları
  vllm:
    model: "Qwen/Qwen2.5-VL-7B-Instruct"
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_model_len: 8192
    dtype: "auto"
    trust_remote_code: true
    max_new_tokens: 4096
    temperature: 0.15
    top_p: 0.9
    repetition_penalty: 1.1

  # llama.cpp ayarları
  llama_cpp:
    base_url: "http://localhost:8080"   # llama-server'ın dinlediği adres
    model: "TimeLens-7B.i1-Q4_K_M.gguf"  # pipeline.py'nin "model" key'iyle okuduğu alan
    model_repo: "mradermacher/TimeLens-7B-i1-GGUF"
    model_file: "TimeLens-7B.i1-Q4_K_M.gguf"
    mmproj_repo: "mradermacher/TimeLens-7B-GGUF"
    mmproj_file: "TimeLens-7B.mmproj-f16.gguf"
    n_ctx: 8192
    n_gpu_layers: 0        # Vulkan bu makinede kararsız (DeviceLost/askıda kalma); 0 = CPU-only
    temperature: 0.15
    max_tokens: 16000
    top_p: 0.9
    repeat_penalty: 1.15

  # Transformers / ROCm ayarları
  transformers:
    model: "llava-hf/LLaVA-NeXT-Video-7B-hf"
    torch_dtype: "bfloat16"
    attn_implementation: "eager"
    max_new_tokens: 1024
    repetition_penalty: 1.15

# ---------------------------------------------------------------------------
# Karar Ajanı & Prompt
# ---------------------------------------------------------------------------
decision_agent:
  system_prompt: |
    You are an Occupational Health and Safety (OHS) video analysis decision
    agent. You receive evidence from three independent channels: geometric
    event signals (YOLO + rule engine), risk catalog matches (RAG context),
    and an independent VLM's frame interpretation. You make the final
    decision; evaluate the evidence with the following line of thought.

    First, lay the evidence side by side. Look at each detection's own
    confidence score; treat low-confidence claims that stand alone with
    caution. If more than one independent module reports the same event,
    that is your strongest evidence. If sources conflict, weigh which one is
    more reliable in that situation: for geometric measurements such as
    distance, angle, and speed the rule engine is objective; things that are
    not among the YOLO classes, such as fire, smoke, and leakage, can only be
    seen by the VLM — but note visual claims that are not confirmed by other
    evidence as "single source" in the reasoning field and adjust your
    confidence accordingly.

    Then look at time. A sign that appears in a single frame and disappears
    does not carry the same weight as a condition that persists for seconds.
    A behavior sustained across consecutive frames by the same track ID is a
    real event; momentary detections of uncertain identity are suspicious —
    reflect this in the confidence values.

    Finally, prioritize. Situations that directly threaten human health
    (falling, tip-over, fire/smoke, dangerous proximity) always take
    precedence over equipment-level warnings; order your risk level, actions,
    and tool selection according to this priority.

    The risk level and actions in the RAG context are the catalog's ground
    truth: take them as the basis, but if your own evidence assessment
    requires a higher risk, do not hesitate to deviate and explain the reason
    for the deviation in reasoning.

    When naming objects, use the perception layer's class names (insan,
    forklift, palet, baret, yelek); describe your own visual observations in
    general terms. Write timestamps in "MM:SS" format.

  include_scene_graph: true
  include_event_signals: true
  include_rag_context: true

# ---------------------------------------------------------------------------
# Guardrail & Çıktı
# ---------------------------------------------------------------------------
output:
  output_schema:
    summary: "string"
    events:
      - time: "string (MM:SS)"
        event: "string"
        event_type: "string"
        confidence: "float 0-1"
    risk: "Düşük | Orta | Yüksek"
    actions:
      - "string"
    reasoning: "string"
    confidence: "float 0-1"
    triggered_mock_tools:
      - tool_name: "string"
        params: "object"
  guardrail:
    max_retries: 3
    temperatures: [0.15, 0.10, 0.05]
    enable_semantic_check: true
    null_response: "Bilmiyorum"

# ---------------------------------------------------------------------------
# Performans & Ölçümleme
# ---------------------------------------------------------------------------
metrics:
  enabled: true
  log_inference_time: true
  log_memory_usage: true
  output_json: "outputs/metrics.json"
