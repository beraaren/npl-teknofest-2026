patterns:
  lathe_entanglement:
    description: "Torna tezgahına uzun talaş, saçak veya gevşek kıyafet sarılması sonucu sıkışma."
    risk_score: 85
    risk_level: "Yüksek"
    indicators:
      - "torna dönerken parça sarılma"
      - "operatör makineye doğru çekiliyor"
      - "gevşek giysi/atkı"
      - "VLM tarafından torna sıkışma"
    keywords: "torna sıkışma talaş sarılma parça çekilme"
    required_nodes: ["makine", "insan"]
    potential_hazards:
      - "Sıkışma"
      - "Kırık"
      - "Ölüm"
    mock_tool_hints:
      - "isolate_electrical_grid"
      - "call_ambulance"
      - "secure_area"

  press_crush:
    description: "Hidrolik veya mekanik presin çalışma anında personeli ezmesi."
    risk_score: 100
    risk_level: "Yüksek"
    indicators:
      - "pres hareket halinde"
      - "insan pres içinde veya arasında"
      - "koruyucu kilidi yok"
      - "VLM tarafından pres ezme"
    keywords: "pres ezme hidrolik mekanik insan içinde"
    required_nodes: ["makine", "insan"]
    potential_hazards:
      - "Ezilme"
      - "Ölüm"
      - "Amputasyon"
    mock_tool_hints:
      - "call_ambulance"
      - "broadcast_evacuation"
      - "secure_area"

  milling_machine_injury:
    description: "Freze tezgahına parçacık, el veya alet kaçması sonucu yaralanma."
    risk_score: 75
    risk_level: "Yüksek"
    indicators:
      - "freze bıçağı dönerken"
      - "operatör elini yakın tutuyor"
      - "parça hareketli"
      - "VLM tarafından freze yaralanma"
    keywords: "freze tezgah bıçak parça el kaçma"
    required_nodes: ["makine", "insan"]
    potential_hazards:
      - "Kesik"
      - "Kırık"
      - "Göz yaralanması"
    mock_tool_hints:
      - "call_health_team"
      - "secure_area"
      - "notify_supervisor"

  conveyor_entanglement:
    description: "Personelin kıyafetinin, saçının veya malzemesinin hareketli banda sıkışması."
    risk_score: 90
    risk_level: "Yüksek"
    indicators:
      - "bant hareket halinde"
      - "insan banta yakın sıkışmış"
      - "tambur/aktarma mekanizması açık"
      - "VLM tarafından bant sıkışma"
    keywords: "bant konveyör sıkışma tambur mekanizma"
    required_nodes: ["makine", "insan"]
    potential_hazards:
      - "Sıkışma"
      - "Ezilme"
      - "Ölüm"
    mock_tool_hints:
      - "isolate_electrical_grid"
      - "call_ambulance"
      - "secure_area"

  robot_arm_strike:
    description: "Endüstriyel robot kolunun personele çarpması veya sıkıştırması."
    risk_score: 85
    risk_level: "Yüksek"
    indicators:
      - "robot kolu hareketli"
      - "insan robot hücresi içinde"
      - "güvenlik bariyeri ihlal"
      - "VLM tarafından robot çarpma"
    keywords: "robot kol çarpma hücre bariyer endüstriyel"
    required_nodes: ["makine", "insan"]
    potential_hazards:
      - "Çarpma"
      - "Sıkışma"
      - "Yaralanma"
    mock_tool_hints:
      - "isolate_electrical_grid"
      - "call_ambulance"
      - "secure_area"

  power_tool_kickback:
    description: "Zımpara, daire testere veya matkap gibi el aletinin geri tepmesi sonucu yaralanma."
    risk_score: 70
    risk_level: "Yüksek"
    indicators:
