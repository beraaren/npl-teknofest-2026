    required_nodes: ["insan"]
    potential_hazards:
      - "Yanık"
      - "Ağrı"
      - "İş kaybı"
    mock_tool_hints:
      - "call_health_team"
      - "notify_supervisor"

  printer_toner_inhalation:
    description: "Yazıcı toner tozunun solunması veya toner değişimi sırasında dökülme."
    risk_score: 40
    risk_level: "Düşük"
    indicators:
      - "toner değiştiriliyor"
      - "siyah toz saçılmış"
      - "maske yok"
      - "VLM tarafından toner solunum"
    keywords: "toner solunum yazıcı toz dökülme ofis"
    required_nodes: ["insan"]
    potential_hazards:
      - "Solunum tahrişi"
      - "Alerjik reaksiyon"
      - "Uzun vadeli maruziyet"
    mock_tool_hints:
